name: Build and deploy auditlogger artifact
on: [workflow_dispatch, push]

env:
  TZ: Europe/Helsinki

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check time
        run: date
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'maven'
      - name: Maven version
        run: mvn --version
      - name: Build
        run: mvn clean package -B
      - name: Copy Artifact
        run: mkdir staging && cp target/*.jar staging
      - name: Upload auditlogger-package
        uses: actions/upload-artifact@v4
        with:
          name: auditlogger
          path: staging
  deploy-artifact:
    needs: [build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'maven'
      - name: Maven version
        run: mvn --version
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn deploy -DskipTests --settings settings.xml